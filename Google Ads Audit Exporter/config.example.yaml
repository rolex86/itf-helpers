customer_id: "1234567890"

date_range:
  preset: "LAST_90_DAYS"
  date_from: null
  date_to: null

output:
  base_dir: "exports"
  xlsx_filename: "audit_export.xlsx"
  include_raw_csv: true
  include_metadata: true

cost_policy:
  free_only: true
  forbid_paid_cloud_resources: true
  allow_local_storage_only: true

pagespeed:
