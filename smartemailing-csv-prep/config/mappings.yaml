# mappings.yaml

sources:
  simple_firma_email:
    detect_columns: ["firma", "email"]
    map:
      company: "firma"
      email_raw: "email"

  full_contact_no_programs:
    detect_columns: ["firma", "email", "jmeno", "obec", "okres", "zeme"]
    map:
      company: "firma"
      email_raw: "email"
      full_name: "jmeno"
      city: "obec"
      district: "okres"
      country: "zeme"

  full_contact_with_programs:
    detect_columns:
      ["firma", "email", "jmeno", "obec", "okres", "zeme", "programy"]
    map:
      external_id: "id"
      company: "firma"
      email_raw: "email"
      full_name: "jmeno"
      city: "obec"
      district: "okres"
      country: "zeme"
      programs_raw: "programy"

  partnerske_plusmobile:
    detect_columns: ["vprfirma", "vpruzivatel", "email"]
    map:
      partner_company: "vprfirma"
      company: "vpruzivatel"
      email_raw: "email"

smartemailing:
  field_map:
    "E-mail": "email"
    "Společnost": "company"
    "Město": "city"
    "Země": "country"
    "okres": "district"
    "Tituly před jménem": "title_before"
    "Jméno": "first_name"
    "Příjmení": "last_name"
    "Tituly za jménem": "title_after"
    # volitelné
    "Poznámky": "notes"

  programs:
    mode: "one_column_per_code"
    fill_value: "{code}"
    also_fill_combined_field: true
    combined_field_name: "prohlížené aplikace plusSystem"
    combined_field_separator: ","
    split_separators: [",", ";", "|", "/"]
    # volitelné aliasy -> cílový kód/sloupec ve SmartEmailing schématu
    code_aliases: {}

  api:
    list_status: "confirmed"
    strict_custom_fields: true
    required_min_custom_fields: 1
    canary_size: 50
    batch_size: 500
    max_contacts_safe: 2000
    max_contacts_full: 10000
    required_confirmation_phrase_full: "FULL IMPORT DO SMARTEMAILINGU"
    import_endpoint_candidates:
      - "/api/v3/import"
    auto_create_unknown_program_fields: true
    auto_create_program_field_type: "text"
    custom_field_create_endpoint_candidates:
      - "/api/v3/customfields"
      - "/api/v3/custom-fields"
    ignore_missing_custom_for_columns:
      - "Tituly před jménem"
      - "Tituly za jménem"
    exclude_columns_from_api_import:
      - "prohlížené aplikace plusSystem"
    custom_fields_endpoint_candidates:
      - "/api/v3/customfields"
      - "/api/v3/custom-fields"
      - "/api/v3/customfield"
      - "/api/v3/custom-field"
      - "/api/v3/customfields/list"
      - "/api/v3/custom-fields/list"
    custom_fields_search_endpoint_candidates: []
    contact_lists_endpoint_candidates:
      - "/api/v3/contactlists"
      - "/api/v3/contact-lists"
    contact_lists_search_endpoint_candidates:
      - "/api/v3/contactlists/search"
      - "/api/v3/contact-lists/search"
    system_field_map:
      "E-mail": "emailaddress"
      "Jméno": "name"
      "Příjmení": "surname"
      "Společnost": "company"
      "Město": "city"
      "Země": "country"
      "Poznámky": "notes"

transforms:
  email:
    split_separators: [",", ";"]
    trim: true

  name:
    title_before_regex: "(^|\\s)(Bc\\.|BcA\\.|Ing\\.|Ing\\.arch\\.|JUDr\\.|MUDr\\.|MVDr\\.|MgA\\.|Mgr\\.|PhDr\\.|RNDr\\.|ThDr\\.|ThLic\\.|doc\\.|prof\\.)(\\s|$)"
    title_after_regex: "(^|\\s)(CSc\\.|Dr\\.|DrSc\\.|Ph\\.D\\.|Th\\.D\\.|MBA|DiS\\.|ACCA|FCCA)(\\s|$)"
    punctuation_strip_regex: "[\\.,;:!?\\-]"
    first_name_rule: "all_but_last_token"
    last_name_rule: "last_token"

  country_bucket:
    cz_sk: ["CZ", "SK"]
    de_at_ch: ["DE", "AT", "CH"]
    other: "EN"
    # volitelné aliasy názvů zemí -> ISO kód
    aliases:
      "česká republika": "CZ"
      "ceska republika": "CZ"
      "czech republic": "CZ"
      "slovensko": "SK"
      "slovakia": "SK"
      "deutschland": "DE"
      "germany": "DE"
      "osterreich": "AT"
      "österreich": "AT"
      "austria": "AT"
      "schweiz": "CH"
      "switzerland": "CH"
