name: Build AV Sync Meter APK

on:
  push:
    branches:
      - feature/avsync-meter-apk
    paths:
      - 'avsync-meter/**'
      - '.github/workflows/avsync-meter.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avsync-meter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk AV-Sync-Meter-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AV-Sync-Meter-v0.1.0
          path: avsync-meter/AV-Sync-Meter-v0.1.0.apk
          if-no-files-found: error
