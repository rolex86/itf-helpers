name: Build AV Sync Meter APK

on:
  push:
    branches:
      - feature/avsync-meter-apk
    paths:
      - 'avsync-meter/**'
      - '.github/workflows/avsync-meter.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'avsync-meter/**'
      - '.github/workflows/avsync-meter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avsync-meter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Correct Android ImageFormat import
        run: sed -i 's/import android.media.ImageFormat;/import android.graphics.ImageFormat;/' app/src/main/java/cz/filip/avsyncmeter/MainActivity.java

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "$status" > build-status.txt
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AV-Sync-Meter-build-log
          path: |
            avsync-meter/build.log
            avsync-meter/build-status.txt
          if-no-files-found: warn

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AV-Sync-Meter-v0.1.1.apk
          sha256sum AV-Sync-Meter-v0.1.1.apk > SHA256SUMS.txt
          unzip -t AV-Sync-Meter-v0.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AV-Sync-Meter-v0.1.1
          path: |
            avsync-meter/AV-Sync-Meter-v0.1.1.apk
            avsync-meter/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish exact APK binary to download branch
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp avsync-meter/AV-Sync-Meter-v0.1.1.apk "$publish_dir/"
          cp avsync-meter/SHA256SUMS.txt "$publish_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-publish-temp
          git rm -rf .
          git clean -fdx
          cp "$publish_dir/AV-Sync-Meter-v0.1.1.apk" .
          cp "$publish_dir/SHA256SUMS.txt" .
          git add AV-Sync-Meter-v0.1.1.apk SHA256SUMS.txt
          git commit -m "Publish verified AV Sync Meter v0.1.1"
          git push --force origin HEAD:apk-download
