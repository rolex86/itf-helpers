name: Build AV Sync Meter APK

on:
  push:
    branches:
      - feature/avsync-meter-apk
    paths:
      - 'avsync-meter/**'
      - '.github/workflows/avsync-meter.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'avsync-meter/**'
      - '.github/workflows/avsync-meter.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avsync-meter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Correct Android ImageFormat import
        run: sed -i 's/import android.media.ImageFormat;/import android.graphics.ImageFormat;/' app/src/main/java/cz/filip/avsyncmeter/MainActivity.java

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "$status" > build-status.txt
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AV-Sync-Meter-build-log
          path: |
            avsync-meter/build.log
            avsync-meter/build-status.txt
          if-no-files-found: warn

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk AV-Sync-Meter-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AV-Sync-Meter-v0.1.0
          path: avsync-meter/AV-Sync-Meter-v0.1.0.apk
          if-no-files-found: error
