name: Build AV Sync Meter APK

on:
  push:
    branches:
      - feature/avsync-meter-apk
    paths:
      - 'avsync-meter/**'
      - '.github/workflows/avsync-meter.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'avsync-meter/**'
      - '.github/workflows/avsync-meter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avsync-meter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Android measurement fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/cz/filip/avsyncmeter/MainActivity.java')
          source = path.read_text(encoding='utf-8')

          replacements = {
              'import android.media.ImageFormat;': 'import android.graphics.ImageFormat;',
              'import android.os.Process;': 'import android.os.Process;\nimport android.os.SystemClock;',
              'private double noiseRms = 250.0;': 'private double noiseRms = 10.0;',
              'noiseRms = 250.0;': 'noiseRms = 10.0;',
              'Math.max(1100.0, noiseRms * 4.2)': 'Math.max(18.0, noiseRms * 3.2)',
              'Math.max(4500.0, noiseRms * 8.0)': 'Math.max(80.0, noiseRms * 7.0)',
              'Math.max(750.0, noiseRms * 2.0)': 'Math.max(12.0, noiseRms * 1.8)',
              'Math.max(1800, peakThreshold / 2)': 'Math.max(30, peakThreshold / 2)',
              'long timestampNs = cameraTimestampRealtime ? image.getTimestamp() : System.nanoTime();': '''long timestampNs;
              if (cameraTimestampRealtime) {
                  // Camera REALTIME uses elapsedRealtimeNanos, while AudioTimestamp
                  // TIMEBASE_MONOTONIC uses System.nanoTime. Convert both to one clock.
                  long realtimeToMonotonicOffsetNs =
                          System.nanoTime() - SystemClock.elapsedRealtimeNanos();
                  timestampNs = image.getTimestamp() + realtimeToMonotonicOffsetNs;
              } else {
                  timestampNs = System.nanoTime();
              }''',
              'String cameraClock = cameraTimestampRealtime ? "senzorový čas MONOTONIC" : "náhradní čas callbacku";': 'String cameraClock = cameraTimestampRealtime ? "senzor REALTIME → MONOTONIC" : "náhradní čas callbacku";'
          }

          for old, new in replacements.items():
              if old not in source and new not in source:
                  raise SystemExit(f'Missing expected source fragment: {old}')
              source = source.replace(old, new)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "$status" > build-status.txt
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AV-Sync-Meter-build-log
          path: |
            avsync-meter/build.log
            avsync-meter/build-status.txt
          if-no-files-found: warn

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AV-Sync-Meter-v0.1.3.apk
          sha256sum AV-Sync-Meter-v0.1.3.apk > SHA256SUMS.txt
          unzip -t AV-Sync-Meter-v0.1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AV-Sync-Meter-v0.1.3
          path: |
            avsync-meter/AV-Sync-Meter-v0.1.3.apk
            avsync-meter/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish exact APK binary to download branch
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp avsync-meter/AV-Sync-Meter-v0.1.3.apk "$publish_dir/"
          cp avsync-meter/SHA256SUMS.txt "$publish_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-publish-temp
          git rm -rf .
          git clean -fdx
          cp "$publish_dir/AV-Sync-Meter-v0.1.3.apk" .
          cp "$publish_dir/SHA256SUMS.txt" .
          git add AV-Sync-Meter-v0.1.3.apk SHA256SUMS.txt
          git commit -m "Publish verified AV Sync Meter v0.1.3"
          git push --force origin HEAD:apk-download
